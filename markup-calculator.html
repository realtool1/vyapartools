<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markup Calculator - VyaparTools</title>
    <meta name="description" content="Calculate selling price, gross profit amount, and profit percentage from cost price and markup percentage.">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #218838;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .result-row:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: #0056b3;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #e9ecef;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Markup Calculator</h1>
        <a href="index.html">← Back to Home</a>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="costPrice">Cost Price (₹)</label>
            <input type="number" id="costPrice" placeholder="e.g. 1000" step="any">
        </div>

        <div class="form-group">
            <label for="markupPercent">Markup Percentage (%)</label>
            <input type="number" id="markupPercent" placeholder="e.g. 25" step="any">
        </div>

        <button class="btn" onclick="calculateMarkup()">Calculate Selling Price</button>

        <div class="result-box" id="resultBox">
            <div class="result-row">
                <span>Profit Amount:</span>
                <span id="resProfit">₹0.00</span>
            </div>
            <div class="result-row">
                <span>Gross Profit Margin:</span>
                <span id="resMargin">0%</span>
            </div>
            <div class="result-row">
                <span>Selling Price:</span>
                <span id="resSellingPrice">₹0.00</span>
            </div>
        </div>
    </div>

    <footer>
        &copy; VyaparTools - Simple & Free Business Tools
    </footer>

    <script>
        function calculateMarkup() {
            const cost = parseFloat(document.getElementById('costPrice').value);
            const markup = parseFloat(document.getElementById('markupPercent').value);

            if (isNaN(cost) || isNaN(markup) || cost <= 0 || markup < 0) {
                alert('Please enter valid Cost Price and Markup Percentage.');
                return;
            }

            const profit = (cost * markup) / 100;
            const sellingPrice = cost + profit;
            const margin = (profit / sellingPrice) * 100;

            document.getElementById('resProfit').innerText = '₹' + profit.toFixed(2);
            document.getElementById('resMargin').innerText = margin.toFixed(2) + '%';
            document.getElementById('resSellingPrice').innerText = '₹' + sellingPrice.toFixed(2);

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
