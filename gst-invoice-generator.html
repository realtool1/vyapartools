<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free GST Invoice Generator - VyaparTools</title>
    <meta name="description" content="Generate and print free GST bills and invoices online instantly for small businesses.">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .no-print-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .no-print-header h1 {
            color: #0056b3;
            font-size: 1.8rem;
        }

        .no-print-header a {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .company-details input, .customer-details input {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            line-height: inherit;
            text-align: left;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th {
            background: #0056b3;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        table td input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-action {
            background-color: #28a745;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .btn-print {
            background-color: #0056b3;
            margin-left: 10px;
        }

        .totals-table {
            width: 50%;
            margin-left: auto;
            margin-top: 20px;
        }

        .totals-table td {
            padding: 6px;
        }

        @media print {
            .no-print, .no-print-header {
                display: none !important;
            }
            body {
                background: #fff;
                padding: 0;
            }
            .invoice-box {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-header">
        <h1>GST Invoice Generator</h1>
        <a href="index.html">← Back to Home</a>
    </div>

    <div class="invoice-box">
        <div class="invoice-header">
            <div>
                <h2>TAX INVOICE</h2>
            </div>
            <div>
                <input type="text" placeholder="Invoice No. e.g. INV-001" value="INV-001" style="font-weight:bold; font-size:1.1rem; text-align:right;">
                <input type="date" id="invDate" style="text-align:right;">
            </div>
        </div>

        <div class="details-grid">
            <div class="company-details">
                <strong>Billed By (Your Business):</strong>
                <input type="text" placeholder="Your Shop/Business Name" value="My Business">
                <input type="text" placeholder="Your GSTIN Number" value="22AAAAA0000A1Z5">
                <input type="text" placeholder="Address & Phone" value="Chhattisgarh, India">
            </div>
            <div class="customer-details">
                <strong>Billed To (Customer):</strong>
                <input type="text" placeholder="Customer Name">
                <input type="text" placeholder="Customer GSTIN (Optional)">
                <input type="text" placeholder="Customer Phone/Address">
            </div>
        </div>

        <table id="itemsTable">
            <thead>
                <tr>
                    <th style="width: 45%;">Item Description</th>
                    <th style="width: 15%;">Qty</th>
                    <th style="width: 20%;">Rate (₹)</th>
                    <th style="width: 20%;">Amount (₹)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" placeholder="Item Name / Description" value="Sample Item 1"></td>
                    <td><input type="number" class="qty" value="1" onchange="calculateInvoice()"></td>
                    <td><input type="number" class="rate" value="1000" onchange="calculateInvoice()"></td>
                    <td class="item-total" style="text-align:right;">₹1,000.00</td>
                </tr>
            </tbody>
        </table>

        <button class="btn-action no-print" onclick="addRow()">+ Add Item</button>

        <table class="totals-table">
            <tr>
                <td>Subtotal:</td>
                <td id="subTotal" style="text-align:right;">₹1,000.00</td>
            </tr>
            <tr>
                <td>
                    GST Rate: 
                    <select id="gstRate" class="no-print" onchange="calculateInvoice()">
                        <option value="0">0%</option>
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18" selected>18%</option>
                        <option value="28">28%</option>
                    </select>
                </td>
                <td id="gstTotal" style="text-align:right;">₹180.00</td>
            </tr>
            <tr style="font-weight:bold; font-size:1.1rem; color:#0056b3;">
                <td>Grand Total:</td>
                <td id="grandTotal" style="text-align:right;">₹1,180.00</td>
            </tr>
        </table>

        <div style="margin-top: 40px; text-align: center;" class="no-print">
            <button class="btn-action btn-print" onclick="window.print()">🖨️ Print / Save PDF Invoice</button>
        </div>
    </div>

    <script>
        document.getElementById('invDate').valueAsDate = new Date();

        function addRow() {
            const table = document.getElementById("itemsTable").getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            newRow.innerHTML = `
                <td><input type="text" placeholder="Item Name / Description"></td>
                <td><input type="number" class="qty" value="1" onchange="calculateInvoice()"></td>
                <td><input type="number" class="rate" value="0" onchange="calculateInvoice()"></td>
                <td class="item-total" style="text-align:right;">₹0.00</td>
            `;
        }

        function calculateInvoice() {
            const rows = document.querySelectorAll("#itemsTable tbody tr");
            let subtotal = 0;

            rows.forEach(row => {
                const qty = parseFloat(row.querySelector(".qty").value) || 0;
                const rate = parseFloat(row.querySelector(".rate").value) || 0;
                const total = qty * rate;
                row.querySelector(".item-total").innerText = '₹' + total.toFixed(2);
                subtotal += total;
            });

            const gstRate = parseFloat(document.getElementById("gstRate").value) || 0;
            const gstAmount = (subtotal * gstRate) / 100;
            const grandTotal = subtotal + gstAmount;

            document.getElementById("subTotal").innerText = '₹' + subtotal.toFixed(2);
            document.getElementById("gstTotal").innerText = '₹' + gstAmount.toFixed(2);
            document.getElementById("grandTotal").innerText = '₹' + grandTotal.toFixed(2);
        }
    </script>
</body>
</html>
