<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator - VyaparTools</title>
    <meta name="description" content="Calculate discount amount, final price after discount, and total savings easily.">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #218838;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .result-row:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: #28a745;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #e9ecef;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Discount Calculator</h1>
        <a href="index.html">← Back to Home</a>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="originalPrice">Original Price (₹)</label>
            <input type="number" id="originalPrice" placeholder="e.g. 2000" step="any">
        </div>

        <div class="form-group">
            <label for="discountPercent">Discount Percentage (%)</label>
            <input type="number" id="discountPercent" placeholder="e.g. 20" step="any">
        </div>

        <button class="btn" onclick="calculateDiscount()">Calculate Discount</button>

        <div class="result-box" id="resultBox">
            <div class="result-row">
                <span>Original Price:</span>
                <span id="resOriginal">₹0.00</span>
            </div>
            <div class="result-row">
                <span>You Save (Discount):</span>
                <span id="resSavings">₹0.00</span>
            </div>
            <div class="result-row">
                <span>Final Price to Pay:</span>
                <span id="resFinal">₹0.00</span>
            </div>
        </div>
    </div>

    <footer>
        &copy; VyaparTools - Simple & Free Business Tools
    </footer>

    <script>
        function calculateDiscount() {
            const price = parseFloat(document.getElementById('originalPrice').value);
            const discount = parseFloat(document.getElementById('discountPercent').value);

            if (isNaN(price) || isNaN(discount) || price < 0 || discount < 0 || discount > 100) {
                alert('Please enter valid Original Price and Discount Percentage (0-100).');
                return;
            }

            const savings = (price * discount) / 100;
            const finalPrice = price - savings;

            document.getElementById('resOriginal').innerText = '₹' + price.toFixed(2);
            document.getElementById('resSavings').innerText = '₹' + savings.toFixed(2);
            document.getElementById('resFinal').innerText = '₹' + finalPrice.toFixed(2);

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
